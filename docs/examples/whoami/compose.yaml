# Minimal project exposed through the reverse proxy: a page that echoes the request.
# @usage SITE=whoami.dev.localhost docker compose up -d
services:
  whoami:
    image: traefik/whoami
    restart: unless-stopped
    networks:
      - proxy
    labels:
      traefik.enable: "true"
      traefik.http.routers.whoami.rule: Host(`${SITE:-whoami.dev.localhost}`)
      traefik.http.routers.whoami.entrypoints: websecure

networks:
  proxy:
    name: proxy
    external: true
