http:
  middlewares:
    # Applied to every router (see compose.prod.yaml).
    security-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: false
        contentTypeNosniff: true
        # Iframes from the same site only: SuiteCRM 8 shows its legacy pages
        # in an iframe, other sites still cannot frame ours (clickjacking).
        customFrameOptionsValue: SAMEORIGIN
        referrerPolicy: strict-origin-when-cross-origin
        browserXssFilter: true

tls:
  options:
    default:
      minVersion: VersionTLS12
      sniStrict: true
