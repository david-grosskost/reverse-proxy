# Production overlay: Let's Encrypt wildcard certificate (DNS challenge at OVH),
# security headers, no dashboard.
services:
  traefik:
    ports:
      - "80:80"
      - "443:443"
    command:
      - --global.checkNewVersion=false
      - --global.sendAnonymousUsage=false
      - --log.level=INFO
      - --accesslog=true
      # Strips ambiguous headers (X.Auth.User read as X-Auth-User by PHP).
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.aliasHeadersStrategy=delete
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.aliasHeadersStrategy=delete
      - --entrypoints.websecure.http.tls.certresolver=letsencrypt
      # One wildcard certificate for every project: site names stay out of the
      # public certificate logs, and no Let's Encrypt limit per new site.
      - --entrypoints.websecure.http.tls.domains[0].main=${ACME_DOMAIN:?ACME_DOMAIN manquant dans .env}
      - --entrypoints.websecure.http.tls.domains[0].sans=*.${ACME_DOMAIN:?ACME_DOMAIN manquant dans .env}
      - --entrypoints.websecure.http.middlewares=crowdsec@file,security-headers@file
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-}
      - --certificatesresolvers.letsencrypt.acme.storage=/certs/acme.json
      # Proves the domain with a temporary TXT record, through the OVH API.
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.provider=ovh
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53
      - --certificatesresolvers.letsencrypt.acme.caserver=${ACME_CA_SERVER:-https://acme-v02.api.letsencrypt.org/directory}
      - --experimental.plugins.bouncer.moduleName=github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
      - --experimental.plugins.bouncer.version=v1.8.1
      - --providers.docker.endpoint=tcp://socket-proxy:2375
      - --providers.docker.exposedByDefault=false
      - --providers.docker.network=proxy
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
    environment:
      OVH_ENDPOINT: ovh-eu
      # Read from the files mounted by Docker, never from environment values.
      OVH_APPLICATION_KEY_FILE: /run/secrets/ovh_application_key
      OVH_APPLICATION_SECRET_FILE: /run/secrets/ovh_application_secret
      OVH_CONSUMER_KEY_FILE: /run/secrets/ovh_consumer_key
    secrets:
      - ovh_application_key
      - ovh_application_secret
      - ovh_consumer_key
    volumes:
      - ./traefik/prod/dynamic:/etc/traefik/dynamic/env:ro
      - ./certs:/certs

secrets:
  # OVH API keys, limited to the DNS zone, entered by make cert@ovh.
  ovh_application_key:
    file: ./secrets/ovh-application-key
  ovh_application_secret:
    file: ./secrets/ovh-application-secret
  ovh_consumer_key:
    file: ./secrets/ovh-consumer-key
