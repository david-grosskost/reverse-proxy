# Base shared by all environments, merged with compose.$APP_ENV.yaml.
name: reverse-proxy

services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      # CrowdSec reads the Docker info before following Traefik's logs.
      INFO: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket

  traefik:
    image: traefik:v3.7
    restart: unless-stopped
    depends_on:
      - socket-proxy
      - crowdsec
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
      - socket
    volumes:
      # WAF middleware, applied to every site (see compose.*.yaml).
      - ./traefik/common/dynamic:/etc/traefik/dynamic/common:ro
    secrets:
      - bouncer_key_traefik
    labels:
      # CrowdSec analyses Traefik's access logs (crowdsec/acquis.d/traefik.yaml).
      crowdsec.enable: "true"
      crowdsec.labels.type: traefik

  # WAF and IP reputation: blocks known attacks (AppSec) and IPs caught
  # scanning or brute-forcing, plus the community blocklist.
  crowdsec:
    image: crowdsecurity/crowdsec:v1.8.1
    restart: unless-stopped
    depends_on:
      - socket-proxy
    security_opt:
      - no-new-privileges:true
    environment:
      COLLECTIONS: crowdsecurity/traefik crowdsecurity/appsec-virtual-patching crowdsecurity/appsec-generic-rules
    volumes:
      - ./crowdsec/acquis.d:/etc/crowdsec/acquis.d:ro
      - crowdsec-config:/etc/crowdsec
      - crowdsec-data:/var/lib/crowdsec/data
    secrets:
      - bouncer_key_traefik
    networks:
      - socket
      # Internet access: rules hub and community blocklist.
      - default

secrets:
  # Shared key between Traefik and CrowdSec, generated by make app@install.
  bouncer_key_traefik:
    file: ./secrets/crowdsec-bouncer.key

volumes:
  crowdsec-config:
  crowdsec-data:

networks:
  # Shared with every exposed project.
  proxy:
    name: proxy
    external: true
  # Traefik, socket-proxy and CrowdSec only.
  socket:
    internal: true
