# Base shared by all environments, merged with compose.$APP_ENV.yaml.
name: reverse-proxy

services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket

  traefik:
    image: traefik:v3.7
    restart: unless-stopped
    depends_on:
      - socket-proxy
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
      - socket

networks:
  # Shared with every exposed project.
  proxy:
    name: proxy
    external: true
  # Traefik <-> socket-proxy only.
  socket:
    internal: true
