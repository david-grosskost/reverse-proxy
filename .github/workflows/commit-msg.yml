# Runs .githooks/commit-msg on every pushed commit, so that commits made
# without the local hook (web UI, other clone…) are checked too.
name: Commit Messages

# Pull requests only: main only receives merged pull requests whose checks
# passed, so running them again on each push would be redundant.
on:
  pull_request:
    # edited: a corrected pull request title is checked again.
    types: [opened, synchronize, reopened, edited]

jobs:
  commit-msg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check commit messages
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
            # New branch: only the commits not already on the default branch.
            range="origin/$DEFAULT_BRANCH..$AFTER"
            [ "$(git rev-parse "origin/$DEFAULT_BRANCH")" = "$AFTER" ] && range="$AFTER~1..$AFTER"
          else
            range="$BEFORE..$AFTER"
          fi

          msg="$(mktemp)"
          failed=0
          for sha in $(git rev-list --reverse "$range"); do
            git log -1 --format=%B "$sha" > "$msg"
            if ! .githooks/commit-msg "$msg"; then
              echo "::error::commit ${sha:0:7} : message non conforme"
              failed=1
            fi
          done
          exit "$failed"

      - name: Check the pull request title
        # Squash merge: the title becomes the commit message on main, the one
        # release-please reads. Checked like a commit message.
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          msg="$(mktemp)"
          printf '%s\n' "$PR_TITLE" > "$msg"
          if ! ".githooks/commit-msg" "$msg"; then
            echo "::error::titre de la pull request non conforme : il devient le message du commit sur main"
            exit 1
          fi
